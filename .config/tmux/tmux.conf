# basic config {{{
set -g default-terminal "${TERM}" # xterm-kitty
# set -g default-terminal "screen-256color"
# set-option -sa terminal-overrides ",xterm-kitty:RGB"
# set -g default-terminal "screen-256color"
# set-option -ga terminal-overrides ",screen-256color:Tc"

set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
unbind C-b; set-option -g prefix C-a; bind-key C-a send-prefix # C-a is prefix
set -g escape-time 0 # pressing escape is instant
set -g history-limit 5000 # more scrollback
set -g display-time 2000 # messages displayed longer
set -g status-keys emacs # better typing in status
setw -g mode-keys vi # vim mode bindings for copy mode
set -g mouse on # enable mouse for tmux
set -g status-interval 5 # status refreshes more often
setw -g aggressive-resize on
  set-option -g detach-on-destroy off # don't detach from current instance when killing session
# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off
set-option -g bell-action none
set-window-option -ga window-status-activity-style fg=black,bg=white,bright
set -s exit-empty off # stop tmux detaching
set -g focus-events on # vim can detect focus gained and lost
# }}}
# Reload tmux shortcut {{{
bind-key -n M-C-S-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux configuration reloaded"
# }}}
# # window and pane numbering {{{
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# # }}}
# set up tpm install {{{
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"
set -g @plugin "tmux-plugins/tpm"
# }}}
# # set up looks {{{
set -g status on
set -g status-bg black # adjust status bar color
set -g status-fg white # adjust status bar color
set -g mode-style "fg=black,bg=yellow" # copy mode colours etc
set-option -ag message-style 'fg=white,bright,bg=black' # status message text
set -g status-justify centre # windows in the centre
set -g window-status-format ' #I:#W#F '
set -g window-status-current-format ' #I:#W#F '
# setw -g window-active-style bg=#1A1B26
# setw -g window-style bg=#1F202E #24283B
set-window-option -g window-status-style fg=default,bg=default,dim # default window
set-window-option -g window-status-current-style fg=default,bg=default,bright # active window
set -g status-left-length 20
set -g status-left "#{tmux_mode_indicator} #[fg=white, bright]#S #[default] "
set -g status-right-length 30
set -g status-right "#[fg=white, bright]%H:%M %d-%b-%y"
# }}}
# tmux mode indicate # {{{
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @mode_indicator_prefix_prompt '  '
set -g @mode_indicator_copy_prompt '  '
set -g @mode_indicator_sync_prompt '  '
set -g @mode_indicator_empty_prompt '  '
set -g @mode_indicator_prefix_mode_style 'bg=blue,fg=blue,bright'
set -g @mode_indicator_copy_mode_style 'bg=yellow,fg=yellow,bright'
set -g @mode_indicator_sync_mode_style 'bg=red,fg=red,bright'
set -g @mode_indicator_empty_mode_style 'bg=green,fg=green,bright'
# }}}
# tmux navigation {{{
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# }}}
# remap some pane commands tmux {{{
bind -n M-o last-window # go to last window
bind -n M-c new-window -c "#{pane_current_path}" # window opens in cwd
bind -n M-- split-window -v -c "#{pane_current_path}" # horizontal pane
bind -n M-_ split-window -fv -c "#{pane_current_path}" # horizontal pane
bind -n M-\\ split-window -h -c "#{pane_current_path}" # vertical pane
bind -n M-| split-window -fh -c "#{pane_current_path}" # vertical pane
bind -n M-x kill-pane
bind -n M-C-x kill-session

unbind '"'; unbind "%" # unbind old commands
bind -rn M-h resize-pane -L 10
bind -rn M-j resize-pane -D 10
bind -rn M-k resize-pane -U 10
bind -rn M-l resize-pane -R 10
# spammable window movement
bind -rn M-p previous-window
bind -rn M-n next-window

bind -n M-0 select-window -t 0
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# spammable window resize
bind -rn M-= next-layout

# put window in front and back
bind -rn M-, swap-window -d -t -1
bind -rn M-. swap-window -d -t +1

bind -n M-e set-window-option synchronize-panes # sync panes with command

# Open session and window trees
bind -n M-s choose-session
bind -n M-w choose-window

bind -n M-C-s switch-client -l
bind -n M-C-p switch-client -p
bind -n M-C-n switch-client -n

bind -n M-C-c command-prompt "new-session -s '%%'"
bind -n M-C-r command-prompt "rename-session '%%'"
bind -n M-r command-prompt "rename-window '%%'"

# # tmux power zoom {{{
set -g @plugin 'jaclu/tmux-power-zoom'
# # }}}
# # tmux restore previous sessions {{{
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session' # restore nvim session (requires vim-obsession)
set -g @resurrect-dir '~/.config/tmux/plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-boot-options 'kitty,fullscreen'
# # }}}
# tmux sessionist (converted to mostly native features)
# set -g @plugin 'tmux-plugins/tmux-sessionist'

# sesh config for tmux
bind -n M-t run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 55%,60% \
		--no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
		--header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
		--bind 'tab:down,btab:up' \
		--bind 'ctrl-a:change-prompt(󱐌 )+reload(sesh list)' \
		--bind 'ctrl-t:change-prompt( )+reload(sesh list -t)' \
		--bind 'ctrl-g:change-prompt( )+reload(sesh list -c)' \
		--bind 'ctrl-x:change-prompt( )+reload(sesh list -z)' \
		--bind 'ctrl-f:change-prompt( )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
		--bind 'ctrl-d:execute(tmux kill-session -t {})+change-prompt(⚡  )+reload(sesh list)'
)\""


# initialise tpm (keep at end of file)
if "test ! -d $TMUX_PLUGIN_MANAGER_PATH/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm $TMUX_PLUGIN_MANAGER_PATH/tpm && $TMUX_PLUGIN_MANAGER_PATH/tpm/bin/install_plugins'"

run "~/.config/tmux/plugins/tpm/tpm"
